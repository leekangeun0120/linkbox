<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>링크서랍</title>
<meta name="theme-color" content="#1f5f5b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 레이아웃: 상단 고정 헤더 + 탭(목록/달력) + 하단 떠있는 추가 버튼. 모바일 한 손 사용 기준 */
:root{
  --bg:#f6f7f6; --card:#ffffff; --fg:#1b2221; --muted:#6b7674; --line:#e3e7e6;
  --accent:#1f5f5b; --accent-soft:#e2efed; --star:#e8a317; --danger:#c0392b;
  --font:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111514; --card:#1a201f; --fg:#e8eeed; --muted:#93a09d; --line:#2a3331;
  --accent:#6fc2ba; --accent-soft:#1e3532; --star:#f0b93a; --danger:#e57366; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111514; --card:#1a201f; --fg:#e8eeed; --muted:#93a09d; --line:#2a3331;
  --accent:#6fc2ba; --accent-soft:#1e3532; --star:#f0b93a; --danger:#e57366; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0}
.top{display:flex;align-items:center;gap:10px}
.top h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.02em;flex:1}
.top h1 small{font-size:13px;font-weight:500;color:var(--muted);margin-left:6px}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:active{background:var(--line)}
.search{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{flex:1;border:0;background:none;color:var(--fg);font:inherit;height:42px;outline:none;min-width:0}
.tabs{display:flex;gap:4px;margin-top:10px;border-bottom:1px solid var(--line)}
.tabs button{padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--fg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
main{padding:0 16px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 0 6px;font-weight:700;font-size:15px}
.sec .meta{font-weight:500;color:var(--muted);font-size:13px}
.sec button{color:var(--muted);font-size:13px;font-weight:500}
.panel{background:var(--card);border-radius:16px;padding:4px 14px}
.folder{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.folder:last-child{border-bottom:0}
.folder .fi{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;font-size:17px}
.folder .fn{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder .fc{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.item:last-child{border-bottom:0}
.thumb{position:relative;flex:none;width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);font-weight:800;font-size:18px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb img.fav{width:28px;height:28px;object-fit:contain}
.thumb .st{position:absolute;top:2px;left:2px;color:var(--star);font-size:15px;text-shadow:0 0 3px rgba(0,0,0,.35)}
.body{flex:1;min-width:0}
.body a{color:inherit;text-decoration:none;display:block}
.ttl{font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.dom{color:var(--muted);font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.side .d{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.more{padding:2px 6px;color:var(--muted);font-size:18px;line-height:1;letter-spacing:1px}
.empty{color:var(--muted);text-align:center;padding:40px 10px;line-height:1.6}
.empty b{color:var(--fg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 18px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700}
:root[data-theme="dark"] .btn{color:#0d1a19}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0d1a19}}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.back{display:flex;align-items:center;gap:6px;margin:16px 0 4px;font-weight:700;font-size:17px}
/* 달력 */
.cal-h{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.cal-h strong{flex:1;text-align:center;font-size:17px}
.today{font-size:12.5px;padding:5px 10px;border-radius:8px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;row-gap:4px}
.grid .wd{color:var(--muted);font-size:12px;padding:6px 0}
.grid .wd:first-child{color:var(--danger)}
.day{height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;font-variant-numeric:tabular-nums}
.day span{width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.day.has i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day.has.many i{width:16px;border-radius:3px}
.day:not(.has) i{width:5px;height:5px}
.day.sel span{background:var(--fg);color:var(--bg);font-weight:700}
.day.now:not(.sel) span{color:var(--accent);font-weight:800}
.day.out{visibility:hidden}
/* FAB, 시트, 토스트 */
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;background:var(--fg);color:var(--bg);font-size:28px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:6}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:4px 0 12px;font-size:17px}
.sheet .row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 2px;border-bottom:1px solid var(--line);text-align:left}
.sheet .row:last-child{border-bottom:0}
.sheet .row.danger{color:var(--danger)}
.sheet .row .sel{margin-left:auto;color:var(--accent);font-weight:700}
.field{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);color:var(--fg);font:inherit;margin-bottom:10px}
textarea.field{height:90px;padding:10px 12px;resize:vertical}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.hint{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 12px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>링크서랍<small id="total"></small></h1>
    <button class="iconbtn" id="menuBtn" aria-label="설정">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="제목, 메모, 주소로 찾기" autocomplete="off">
  </label>
  <div class="tabs" role="tablist">
    <button role="tab" id="tabList" aria-selected="true">목록</button>
    <button role="tab" id="tabCal" aria-selected="false">달력</button>
  </div>
</header>
<div class="chips" id="chips"></div>
<main id="main"></main>
<button class="fab" id="fab" aria-label="링크 추가">+</button>
<input type="file" id="fileTxt" accept=".txt,text/plain" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script>
/* ---------- 저장소 ---------- */
const KEY='linkbox.v1', TKEY='linkbox.thumbs.v1';
let db={links:[],folders:[]}, thumbs={};
try{db=JSON.parse(localStorage.getItem(KEY))||db}catch(e){}
try{thumbs=JSON.parse(localStorage.getItem(TKEY))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('저장 공간이 부족해요. 백업 후 오래된 링크를 정리해주세요.')}};
const saveThumbs=()=>{try{localStorage.setItem(TKEY,JSON.stringify(thumbs))}catch(e){}};

/* ---------- 유틸 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const URL_RE=/https?:\/\/[^\s<>"'`]+/g;
const cleanUrl=u=>u.replace(/[)\]}>,.;:!?'"」』…]+$/,'');
function host(u){try{return new URL(u).hostname.replace(/^www\.|^m\./,'')}catch(e){return u}}

const SITES=[
  ['place','📍 장소',/map\.naver|place\.naver|kakaomap|map\.kakao|google\.[^/]+\/maps|maps\.app\.goo/],
  ['youtube','▶️ 유튜브',/youtube\.com|youtu\.be/],
  ['insta','📷 인스타',/instagram\.com/],
  ['threads','🧵 스레드',/threads\.(net|com)/],
  ['blog','✍️ 블로그',/blog\.naver|tistory|brunch\.co\.kr|velog|medium\.com/],
  ['notion','📝 노션',/notion\.(so|site|com)/],
  ['google','📄 구글문서',/docs\.google|drive\.google|forms\.gle/],
  ['book','📚 책',/aladin|yes24|kyobobook|ridibooks|millie|sarak\.yes24/],
  ['shop','🛍 쇼핑',/lotteon|coupang|temu|smartstore|shopping\.naver|11st|gmarket|aliexpress|musinsa|ohou|29cm|kurly|klook|myrealtrip|agoda|booking/],
];
function siteOf(u){
  const h=host(u);
  if(/naver\.me/.test(h))return 'naver';
  for(const [k,,re] of SITES) if(re.test(u))return k;
  return 'etc';
}
const SITE_LABEL=Object.fromEntries([...SITES.map(s=>[s[0],s[1]]),['naver','🟢 네이버 공유'],['etc','🔗 기타']]);

function titleFrom(text,url){
  const lines=String(text||'').replace(URL_RE,'').split(/\n/).map(l=>l.trim())
    .filter(l=>l && !/^[-–·•]+$/.test(l) && !/^\[.*\]$/.test(l) && !/^출처\s*:/.test(l));
  let t=(lines[0]||'').replace(/^[-–·•]\s*/,'').trim();
  return t || host(url);
}
function ytId(u){const m=u.match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/);return m?m[1]:null}

/* ---------- 카톡 내보내기 파싱 ---------- */
function parseKakao(raw){
  const lines=raw.replace(/^\uFEFF/,'').split(/\r?\n/);
  const head=/^(\d{4})년 (\d{1,2})월 (\d{1,2})일 (오전|오후) (\d{1,2}):(\d{2}), (.+?) : (.*)$/;
  const dateOnly=/^\d{4}년 \d{1,2}월 \d{1,2}일 (오전|오후) \d{1,2}:\d{2}$/;
  // PC판 내보내기 형식: 2024. 12. 29. 오후 2:42, 이름 : 내용
  const headPc=/^(\d{4})\. (\d{1,2})\. (\d{1,2})\. (오전|오후) (\d{1,2}):(\d{2}), (.+?) : (.*)$/;
  const msgs=[];let cur=null;
  for(const line of lines){
    const m=line.match(head)||line.match(headPc);
    if(m){
      let h=+m[5]%12; if(m[4]==='오후')h+=12;
      cur={date:new Date(+m[1],+m[2]-1,+m[3],h,+m[6]),text:m[8]};msgs.push(cur);
    }else if(dateOnly.test(line.trim())){cur=null}
    else if(cur){cur.text+='\n'+line}
  }
  const out=[];
  for(const msg of msgs){
    const urls=[...new Set((msg.text.match(URL_RE)||[]).map(cleanUrl))];
    for(const url of urls){
      out.push({url,title:titleFrom(msg.text,url),note:msg.text.trim(),date:msg.date.toISOString()});
    }
  }
  return out;
}

function addLinks(arr){
  const have=new Set(db.links.map(l=>l.url));let n=0;
  for(const a of arr){
    if(have.has(a.url))continue;have.add(a.url);
    db.links.push({id:uid(),url:a.url,title:a.title,note:a.note||'',date:a.date||new Date().toISOString(),folder:null,star:false});n++;
  }
  save();return n;
}

/* ---------- 공유하기로 들어온 링크 ---------- */
function receiveShare(){
  const p=new URLSearchParams(location.search);
  if(!p.has('url')&&!p.has('text')&&!p.has('title'))return;
  const title=p.get('title')||'', text=p.get('text')||'', u=p.get('url')||'';
  const found=[...new Set([u,...(text.match(URL_RE)||[])].filter(Boolean).map(cleanUrl))].filter(x=>/^https?:/.test(x));
  history.replaceState(null,'',location.pathname);
  if(!found.length){setTimeout(()=>toast('공유된 내용에서 링크를 찾지 못했어요'),300);return}
  const body=[title,text].filter(Boolean).join('\n');
  const n=addLinks(found.map(url=>({url,title:titleFrom(body,url),note:body})));
  setTimeout(()=>toast(n?'링크를 담았어요 ✓':'이미 담겨 있는 링크예요'),300);
  if(n){state.view='list';state.folder=null;state.justAdded=db.links[db.links.length-1].id}
}

/* ---------- 상태 & 렌더 ---------- */
const state={view:'list',folder:null,site:'all',q:'',month:new Date(),day:dkey(new Date()),justAdded:null};
function filtered(){
  const q=state.q.trim().toLowerCase();
  return db.links.filter(l=>(state.site==='all'||(state.site==='star'?l.star:siteOf(l.url)===state.site))
    &&(!q||(l.title+' '+l.note+' '+l.url).toLowerCase().includes(q)))
    .sort((a,b)=>b.date.localeCompare(a.date));
}
function fmtDate(iso){
  const d=new Date(iso),now=new Date();const diff=Math.floor((new Date(dkey(now))-new Date(dkey(d)))/864e5);
  if(diff===0)return '오늘';if(diff===1)return '어제';
  return d.getFullYear()===now.getFullYear()?`${d.getMonth()+1}. ${d.getDate()}.`:`${String(d.getFullYear()).slice(2)}. ${d.getMonth()+1}. ${d.getDate()}.`;
}
function itemHTML(l){
  const yt=ytId(l.url), t=thumbs[l.url];
  let img='';
  if(yt)img=`<img src="https://i.ytimg.com/vi/${yt}/mqdefault.jpg" alt="" loading="lazy">`;
  else if(t&&t.img)img=`<img src="${esc(t.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<img class=fav src=\\'https://www.google.com/s2/favicons?domain=${esc(host(l.url))}&sz=64\\' alt=\\'\\'>'">`;
  else img=`<img class="fav" src="https://www.google.com/s2/favicons?domain=${esc(host(l.url))}&sz=64" alt="" loading="lazy">`;
  const title=(t&&t.title&&(l.title===host(l.url)))?t.title:l.title;
  return `<div class="item" data-id="${l.id}" data-url="${esc(l.url)}">
    <a class="thumb" href="${esc(l.url)}" target="_blank" rel="noopener">${img}${l.star?'<span class="st">★</span>':''}</a>
    <div class="body"><a href="${esc(l.url)}" target="_blank" rel="noopener"><div class="ttl">${esc(title)}</div><div class="dom">${esc(host(l.url))}</div></a></div>
    <div class="side"><span class="d">${fmtDate(l.date)}</span><button class="more" data-more="${l.id}" aria-label="더보기">•••</button></div></div>`;
}
const PAGE=60;let shown=PAGE;
function render(){
  $('#total').textContent=db.links.length?`${db.links.length}개`:'';
  $('#tabList').setAttribute('aria-selected',state.view!=='cal');
  $('#tabCal').setAttribute('aria-selected',state.view==='cal');
  renderChips();
  const m=$('#main');
  if(!db.links.length){m.innerHTML=emptyHTML();return}
  if(state.view==='cal')return renderCal();
  const list=filtered();
  if(state.folder){
    const f=db.folders.find(f=>f.id===state.folder);
    const inF=list.filter(l=>l.folder===state.folder);
    m.innerHTML=`<button class="back" id="backBtn">‹ ${esc(f?f.icon+' '+f.name:'폴더')}</button>
      <div class="sec"><span class="meta">${inF.length}개</span><button data-fmenu="${state.folder}">폴더 편집</button></div>
      <div class="panel">${inF.map(itemHTML).join('')||'<div class="empty">아직 비어 있어요.<br>링크의 ••• 에서 이 폴더로 옮길 수 있어요.</div>'}</div>`;
  }else{
    const loose=list.filter(l=>!l.folder||!db.folders.some(f=>f.id===l.folder));
    const searching=state.q||state.site!=='all';
    const cnt=id=>list.filter(l=>l.folder===id).length;
    m.innerHTML=`${searching?'':`<div class="sec">폴더<button id="addFolder">폴더 추가 +</button></div>
      <div class="panel">${db.folders.length?db.folders.map(f=>`<button class="folder" data-folder="${f.id}"><span class="fi">${esc(f.icon)}</span><span class="fn">${esc(f.name)}</span><span class="fc">${cnt(f.id)}</span><span style="color:var(--muted)">›</span></button>`).join(''):'<div class="hint" style="padding:12px 0;margin:0">통영 맛집, 읽을거리처럼 폴더를 만들어 모아보세요.</div>'}</div>`}
      <div class="sec">${searching?'찾은 링크':'폴더 없는 링크'}<span class="meta">${(searching?list:loose).length}</span></div>
      <div class="panel" id="listPanel">${(searching?list:loose).slice(0,shown).map(itemHTML).join('')||'<div class="empty">조건에 맞는 링크가 없어요.</div>'}</div>
      ${(searching?list:loose).length>shown?`<div style="text-align:center;margin:14px 0"><button class="btn ghost" id="moreBtn">더 보기</button></div>`:''}`;
  }
  observeThumbs();
  if(state.justAdded){const el=document.querySelector(`[data-id="${state.justAdded}"]`);if(el){el.scrollIntoView({block:'center'});el.style.background='var(--accent-soft)';setTimeout(()=>el.style.background='',1500)}state.justAdded=null}
}
function renderChips(){
  const counts={};db.links.forEach(l=>{const s=siteOf(l.url);counts[s]=(counts[s]||0)+1});
  const stars=db.links.filter(l=>l.star).length;
  const keys=Object.keys(SITE_LABEL).filter(k=>counts[k]);
  $('#chips').hidden=!db.links.length;
  $('#chips').innerHTML=[`<button class="chip" data-site="all" aria-pressed="${state.site==='all'}">전체</button>`,
    stars?`<button class="chip" data-site="star" aria-pressed="${state.site==='star'}">★ 별표 ${stars}</button>`:'',
    ...keys.map(k=>`<button class="chip" data-site="${k}" aria-pressed="${state.site===k}">${SITE_LABEL[k]} ${counts[k]}</button>`)].join('');
}
function emptyHTML(){
  return `<div class="empty" style="padding-top:60px"><div style="font-size:44px">🗂</div>
  <p><b>아직 담긴 링크가 없어요</b></p>
  <p>카톡 '나와의 채팅' 내보내기 파일을 불러오면<br>그동안 보낸 링크를 한 번에 정리해 드려요.</p>
  <p style="margin-top:18px"><button class="btn" data-act="importTxt">카톡 대화 파일 불러오기</button></p>
  <p style="font-size:13px">카톡 ‘나와의 채팅’ → ☰ → ⚙️ → 대화 내용 내보내기 → 텍스트만 보내기</p></div>`;
}
function renderCal(){
  const list=filtered(), byDay={};
  list.forEach(l=>{const k=dkey(new Date(l.date));(byDay[k]=byDay[k]||[]).push(l)});
  const y=state.month.getFullYear(),mo=state.month.getMonth();
  const first=new Date(y,mo,1).getDay(),days=new Date(y,mo+1,0).getDate(),today=dkey(new Date());
  let cells='';for(let i=0;i<first;i++)cells+='<div class="day out"></div>';
  for(let d=1;d<=days;d++){const k=`${y}-${pad(mo+1)}-${pad(d)}`,n=(byDay[k]||[]).length;
    cells+=`<button class="day${n?' has':''}${n>2?' many':''}${k===state.day?' sel':''}${k===today?' now':''}" data-day="${k}" aria-label="${mo+1}월 ${d}일 링크 ${n}개"><span>${d}</span><i></i></button>`}
  const sel=byDay[state.day]||[], sd=new Date(state.day);
  $('#main').innerHTML=`<div class="cal-h"><button class="iconbtn" data-mon="-1" aria-label="이전 달">‹</button><button class="today" data-mon="0">오늘</button><strong>${y}년 ${mo+1}월</strong><span style="width:52px"></span><button class="iconbtn" data-mon="1" aria-label="다음 달">›</button></div>
    <div class="panel" style="padding:8px"><div class="grid">${'일월화수목금토'.split('').map(w=>`<div class="wd">${w}</div>`).join('')}${cells}</div></div>
    <div class="sec">${sd.getMonth()+1}월 ${sd.getDate()}일 (${'일월화수목금토'[sd.getDay()]})<span class="meta">${sel.length}</span></div>
    <div class="panel">${sel.map(itemHTML).join('')||'<div class="empty" style="padding:24px">이 날 담은 링크가 없어요</div>'}</div>`;
  observeThumbs();
}

/* ---------- 썸네일 (미리보기 이미지) ---------- */
let io, queue=[], busy=0;
function observeThumbs(){
  io&&io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);enqueue(e.target.dataset.url)}}),{rootMargin:'200px'});
  document.querySelectorAll('.item').forEach(el=>{const u=el.dataset.url;if(!ytId(u)&&!thumbs[u])io.observe(el)});
}
function enqueue(u){if(!queue.includes(u))queue.push(u);pump()}
async function pump(){
  if(busy>=2||!queue.length)return;
  const u=queue.shift();if(thumbs[u]){pump();return}
  busy++;
  try{
    const r=await fetch('https://api.microlink.io/?url='+encodeURIComponent(u));
    if(r.status===429){queue=[];busy--;return}           // 하루 무료 한도 초과 → 내일 이어서
    const j=await r.json();
    thumbs[u]={img:j?.data?.image?.url||j?.data?.logo?.url||'',title:j?.data?.title||'',t:Date.now()};
    saveThumbs();
    const el=document.querySelector(`.item[data-url="${CSS.escape(u)}"]`);
    if(el){const l=db.links.find(x=>x.url===u);if(l)el.outerHTML=itemHTML(l)}
  }catch(e){}
  busy--;pump();
}

/* ---------- 시트(아래에서 올라오는 메뉴) ---------- */
function sheet(html,onMount){
  const s=document.createElement('div');s.className='scrim';
  s.innerHTML=`<div class="sheet" role="dialog"><div class="grab"></div>${html}</div>`;
  s.addEventListener('click',e=>{if(e.target===s)s.remove()});
  document.body.appendChild(s);onMount&&onMount(s.querySelector('.sheet'),()=>s.remove());
}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

function linkMenu(id){
  const l=db.links.find(x=>x.id===id);if(!l)return;
  sheet(`<h3 style="word-break:break-all">${esc(l.title)}</h3>
    <button class="row" data-a="star">${l.star?'☆ 별표 빼기':'★ 별표 달기'}</button>
    <button class="row" data-a="move">🗂 폴더 이동${l.folder?` <span class="sel">${esc(db.folders.find(f=>f.id===l.folder)?.name||'')}</span>`:''}</button>
    <button class="row" data-a="edit">✏️ 제목·메모 수정</button>
    <button class="row" data-a="copy">🔗 링크 복사</button>
    <button class="row danger" data-a="del">🗑 삭제</button>`,(el,close)=>{
    el.addEventListener('click',e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;
      if(a==='star'){l.star=!l.star;save();close();render()}
      if(a==='copy'){navigator.clipboard?.writeText(l.url).then(()=>toast('복사했어요'),()=>toast(l.url));close()}
      if(a==='move'){close();moveMenu(l)}
      if(a==='edit'){close();editMenu(l)}
      if(a==='del'){if(e.target.dataset.sure){db.links=db.links.filter(x=>x.id!==id);save();close();render();toast('삭제했어요')}else{e.target.dataset.sure=1;e.target.textContent='🗑 한 번 더 누르면 삭제돼요'}}
    })});
}
function moveMenu(l){
  sheet(`<h3>어느 폴더로 옮길까요?</h3>
    ${db.folders.map(f=>`<button class="row" data-f="${f.id}">${esc(f.icon)} ${esc(f.name)}${l.folder===f.id?'<span class="sel">✓</span>':''}</button>`).join('')}
    <button class="row" data-f="">📂 폴더에서 빼기${!l.folder?'<span class="sel">✓</span>':''}</button>
    <button class="row" data-f="new">＋ 새 폴더 만들어서 넣기</button>`,(el,close)=>{
    el.addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;close();
      if(b.dataset.f==='new')folderEdit(null,f=>{l.folder=f.id;save();render()});
      else{l.folder=b.dataset.f||null;save();render();toast('옮겼어요')}})});
}
function editMenu(l){
  sheet(`<h3>제목·메모 수정</h3>
    <input class="field" id="eTitle" value="${esc(l.title)}" placeholder="제목">
    <textarea class="field" id="eNote" placeholder="메모">${esc(l.note)}</textarea>
    <div class="actions"><button class="btn" id="eSave">저장</button></div>`,(el,close)=>{
    el.querySelector('#eSave').onclick=()=>{l.title=el.querySelector('#eTitle').value.trim()||host(l.url);l.note=el.querySelector('#eNote').value;save();close();render()}});
}
const ICONS=['🍽','☕','✈️','🏨','📍','🛍','📚','🎬','💡','🏠','💰','🏃','🎁','📌'];
function folderEdit(f,cb){
  let icon=f?f.icon:'📌';
  sheet(`<h3>${f?'폴더 편집':'새 폴더'}</h3>
    <input class="field" id="fName" value="${esc(f?f.name:'')}" placeholder="예: 통영 맛집">
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px" id="icons">${ICONS.map(i=>`<button class="chip" data-i="${i}" aria-pressed="${i===icon}" style="font-size:18px;padding:6px 10px">${i}</button>`).join('')}</div>
    <div class="actions">${f?'<button class="btn ghost" id="fDel" style="margin-right:auto;color:var(--danger)">폴더 삭제</button>':''}<button class="btn" id="fSave">${f?'저장':'만들기'}</button></div>`,(el,close)=>{
    const inp=el.querySelector('#fName');setTimeout(()=>inp.focus(),50);
    el.querySelector('#icons').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;icon=b.dataset.i;el.querySelectorAll('#icons .chip').forEach(c=>c.setAttribute('aria-pressed',c===b))};
    el.querySelector('#fSave').onclick=()=>{const name=inp.value.trim();if(!name){inp.focus();return}
      if(f){f.name=name;f.icon=icon}else{f={id:uid(),name,icon};db.folders.push(f)}save();close();cb?cb(f):render()};
    const del=el.querySelector('#fDel');if(del)del.onclick=()=>{if(!del.dataset.sure){del.dataset.sure=1;del.textContent='한 번 더 누르면 삭제';return}
      db.links.forEach(l=>{if(l.folder===f.id)l.folder=null});db.folders=db.folders.filter(x=>x!==f);state.folder=null;save();close();render();toast('폴더를 지웠어요. 링크는 남아 있어요')};
  });
}
function addMenu(){
  sheet(`<h3>링크 추가</h3>
    <p class="hint">다른 앱에서 <b>공유 → 링크서랍</b>을 누르면 더 빨라요. (홈 화면에 설치한 경우)</p>
    <input class="field" id="aUrl" placeholder="https://" inputmode="url">
    <input class="field" id="aTitle" placeholder="제목 (비워두면 자동)">
    <div class="actions"><button class="btn" id="aSave">담기</button></div>`,(el,close)=>{
    const u=el.querySelector('#aUrl');setTimeout(()=>u.focus(),50);
    el.querySelector('#aSave').onclick=()=>{const m=u.value.match(URL_RE);if(!m){toast('링크 주소를 넣어주세요');return}
      const url=cleanUrl(m[0]);const t=el.querySelector('#aTitle').value.trim();
      const n=addLinks([{url,title:t||titleFrom(u.value,url),note:u.value}]);close();
      if(n)state.justAdded=db.links[db.links.length-1].id;state.view='list';render();toast(n?'담았어요':'이미 담겨 있는 링크예요')};
  });
}
function settingsMenu(){
  const cur=document.documentElement.dataset.theme||'system';
  sheet(`<h3>설정</h3>
    <button class="row" data-s="txt">💬 카톡 대화 파일 불러오기 <span class="sel" style="font-weight:400;color:var(--muted);font-size:13px">새 링크만 추가</span></button>
    <button class="row" data-s="backup">💾 백업 파일 저장</button>
    <button class="row" data-s="restore">📥 백업 파일 불러오기</button>
    <button class="row" data-s="theme">🌓 화면 모드 <span class="sel">${{system:'기기 설정',light:'밝게',dark:'어둡게'}[cur]}</span></button>
    <button class="row" data-s="install">📲 홈 화면에 설치하는 법</button>
    <button class="row danger" data-s="wipe">🗑 전체 지우기</button>
    <p class="hint" style="margin-top:12px">링크는 이 폰의 브라우저 안에만 저장돼요. 가끔 백업 파일을 저장해 두세요.</p>`,(el,close)=>{
    el.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;const s=b.dataset.s;
      if(s==='txt'){close();$('#fileTxt').click()}
      if(s==='restore'){close();$('#fileJson').click()}
      if(s==='backup'){const blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`링크서랍_백업_${dkey(new Date())}.json`;a.click();close()}
      if(s==='theme'){const nx={system:'light',light:'dark',dark:'system'}[cur];if(nx==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=nx;try{localStorage.setItem('linkbox.theme',nx)}catch(e){}close();settingsMenu()}
      if(s==='install'){close();sheet(`<h3>홈 화면에 설치하기</h3><p class="hint">1. 크롬에서 이 페이지를 연 상태로 오른쪽 위 <b>⋮</b><br>2. <b>홈 화면에 추가</b> (또는 <b>앱 설치</b>)<br>3. 설치 후엔 네이버지도·유튜브·인스타에서 <b>공유</b>를 누르면 목록에 <b>링크서랍</b>이 나와요.</p><p class="hint">공유 목록에 안 보이면 공유창의 ‘더보기’에서 찾아 고정해 두세요.</p>`)}
      if(s==='wipe'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='🗑 정말요? 한 번 더 누르면 전부 지워져요';return}db={links:[],folders:[]};save();close();render()}
    })});
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',e=>{
  const t=e.target;let b;
  if(b=t.closest('[data-more]'))return linkMenu(b.dataset.more);
  if(b=t.closest('[data-folder]')){state.folder=b.dataset.folder;window.scrollTo(0,0);return render()}
  if(b=t.closest('[data-fmenu]'))return folderEdit(db.folders.find(f=>f.id===b.dataset.fmenu));
  if(t.closest('#backBtn')){state.folder=null;return render()}
  if(t.closest('#addFolder'))return folderEdit(null);
  if(t.closest('#moreBtn')){shown+=PAGE;return render()}
  if(b=t.closest('[data-site]')){state.site=b.dataset.site;shown=PAGE;state.folder=null;return render()}
  if(b=t.closest('[data-day]')){state.day=b.dataset.day;return render()}
  if(b=t.closest('[data-mon]')){const d=+b.dataset.mon;if(d===0){state.month=new Date();state.day=dkey(new Date())}else state.month=new Date(state.month.getFullYear(),state.month.getMonth()+d,1);return render()}
  if(t.closest('[data-act="importTxt"]'))return $('#fileTxt').click();
});
$('#tabList').onclick=()=>{state.view='list';render()};
$('#tabCal').onclick=()=>{state.view='cal';state.folder=null;render()};
$('#fab').onclick=addMenu;
$('#menuBtn').onclick=settingsMenu;
let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value;shown=PAGE;state.folder=null;render()},150)});
$('#fileTxt').onchange=async e=>{const f=e.target.files[0];if(!f)return;const txt=await f.text();e.target.value='';
  const found=parseKakao(txt);if(!found.length){toast('이 파일에서 링크를 찾지 못했어요. 카톡 ‘텍스트만 보내기’ 파일인지 확인해 주세요');return}
  const n=addLinks(found);render();toast(`링크 ${found.length}개 중 새로 ${n}개를 담았어요`)};
$('#fileJson').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.links))throw 0;
  const have=new Set(db.links.map(l=>l.url));const fid=new Set(db.folders.map(f=>f.id));
  j.folders?.forEach(f=>{if(!fid.has(f.id))db.folders.push(f)});const add=j.links.filter(l=>!have.has(l.url));db.links.push(...add);save();render();toast(`${add.length}개를 복원했어요`)}catch(err){toast('백업 파일을 읽지 못했어요')}e.target.value=''};

try{const th=localStorage.getItem('linkbox.theme');if(th&&th!=='system')document.documentElement.dataset.theme=th}catch(e){}
receiveShare();
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
